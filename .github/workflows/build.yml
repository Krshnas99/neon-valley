name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installs Gradle itself, so the project needs no gradle-wrapper.jar
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NeonVolley.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NeonVolley-apk
          path: NeonVolley.apk

      # Also publish it under "Releases" so it can be downloaded straight to a phone
      - name: Publish release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" NeonVolley.apk --title "Neon Volley (build ${{ github.run_number }})" --notes "Debug APK. Download NeonVolley.apk below."
